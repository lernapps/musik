<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../hoeren/">Hören und Klang beschreiben</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bringe die Lautstärken in die Reihenfolge von leise nach laut. Das leiseste zuerst.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>piano</span> <select name="frage-a1-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>pianissimo</span> <select name="frage-a1-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>mezzo forte</span> <select name="frage-a1-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>forte</span> <select name="frage-a1-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>fortissimo</span> <select name="frage-a1-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. pianissimo, 2. piano, 3. mezzo forte, 4. forte, 5. fortissimo</p>
<p class="question-explanation">Piano ist leise, forte ist laut. Mit „mezzo“ liegt der Ton in der Mitte, und die Endung „-issimo“ steigert das Wort.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Dynamik_(Musik)" rel="noopener">Dynamik (Musik) (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In den Noten steht ein f. Wie sollst du spielen oder singen?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Laut</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Schnell</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Leise</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Laut</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Forte heißt laut. Das f steht für das italienische Wort „forte“, das „stark“ bedeutet.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Schnell</strong></p><p>Wie schnell du spielst, sagt das Tempo, zum Beispiel „Allegro“. Das f sagt nur etwas über die Lautstärke.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Leise</strong></p><p>Leise heißt piano und wird mit p geschrieben. Das f ist das Gegenteil.</p></li>
</ul>
<p class="question-explanation">Die Buchstaben p und f beschreiben die Lautstärke. p ist leise, f ist laut.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Dynamik_(Musik)" rel="noopener">Dynamik (Musik) (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bringe die Tempowörter in die Reihenfolge von langsam nach schnell. Das langsamste zuerst.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Moderato</span> <select name="frage-a3-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Presto</span> <select name="frage-a3-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Largo</span> <select name="frage-a3-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Allegro</span> <select name="frage-a3-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Andante</span> <select name="frage-a3-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Largo, 2. Andante, 3. Moderato, 4. Allegro, 5. Presto</p>
<p class="question-explanation">Largo ist sehr langsam, Presto ist sehr schnell. Dazwischen liegen Andante, Moderato und Allegro.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Tempo_(Musik)" rel="noopener">Tempo (Musik) (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welches Instrument gehört zu welcher Familie?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Geige</span> <select name="frage-a5-0" data-left="0"><option value="">bitte wählen</option><option value="0">Streicher</option><option value="2">Blechbläser</option><option value="3">Schlagwerk</option><option value="1">Holzbläser</option></select></label></li>
<li><label><span>Oboe</span> <select name="frage-a5-1" data-left="1"><option value="">bitte wählen</option><option value="0">Streicher</option><option value="2">Blechbläser</option><option value="3">Schlagwerk</option><option value="1">Holzbläser</option></select></label></li>
<li><label><span>Trompete</span> <select name="frage-a5-2" data-left="2"><option value="">bitte wählen</option><option value="0">Streicher</option><option value="2">Blechbläser</option><option value="3">Schlagwerk</option><option value="1">Holzbläser</option></select></label></li>
<li><label><span>Pauke</span> <select name="frage-a5-3" data-left="3"><option value="">bitte wählen</option><option value="0">Streicher</option><option value="2">Blechbläser</option><option value="3">Schlagwerk</option><option value="1">Holzbläser</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Geige – Streicher; Oboe – Holzbläser; Trompete – Blechbläser; Pauke – Schlagwerk</p>
<p class="question-explanation">Die Geige hat Saiten (Streicher). Die Oboe wird geblasen und gehört zu den Holzbläsern. Die Trompete hat ein Mundstück aus Metall (Blechbläser). Die Pauke schlägt man (Schlagwerk).</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Orchester" rel="noopener">Orchester (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="explainer-assessment-live"></div></li>
</ol>
