<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Eine Seite fragt sie nicht ab. Es lohnt sich also, sie einmal anzuschauen:</p>
<ul class="explainer-assessment-unasked">
<li><a href="../../tonhoehe/stimme/">Meine Stimme hat eine Tonhöhe</a></li>
</ul>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>

<fieldset>

<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a1" aria-describedby="frage-a1-unit"> <span id="frage-a1-unit">Hz</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 880 Hz</p>
<p class="question-explanation">Eine Oktave höher bedeutet die doppelte Frequenz. 440 mal 2 ergibt 880.</p>
<p class="question-more">Mehr dazu:</p>

<li><a href="https://de.wikipedia.org/wiki/Kammerton" rel="noopener">Kammerton (Wikipedia)</a></li>

</form>
</div></li>

<li class="question-info" data-option="1"><p class="question-info-head"><strong>Links neben der Gruppe aus drei schwarzen Tasten</strong></p><p>Dort liegt das F. Die Gruppe aus drei schwarzen Tasten beginnt nach dem F.</p></li>
