# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Klangfarbe und Instrumentenfamilien
description: Hören, warum zwei Instrumente bei gleichem Ton verschieden klingen, und Instrumente ihrer Familie zuordnen.
blocks:
  - type: section
    id: ausprobieren
    title: Ausprobieren
    blocks:
      - type: text
        text: |
          Spiele denselben Ton mit den vier Klangfarben. Der Ton ist gleich hoch und gleich laut. Trotzdem klingt er
          jedes Mal anders: weich, hell oder scharf. Das nennt man die Klangfarbe. Hier hörst du einfache Klänge aus dem
          Computer, keine echten Instrumente.
      - type: vue-component
        component: Klangbild
        props: { regler: klangfarbe, hz: 262, form: sine, laut: 20 }
        nojs: |
          Ein Bild einer Welle mit vier Knöpfen: Sinus, Dreieck, Rechteck und Sägezahn. Der Sinus hat eine glatte, runde
          Welle und klingt weich. Das Rechteck springt zwischen oben und unten und klingt scharf. Die Tonhöhe bleibt gleich,
          nur die Form der Welle ändert sich. Mit JavaScript klingt jede Form.
  - type: section
    id: merke
    title: Das Wichtigste
    blocks:
      - type: definition
        term: Klangfarbe
        explanation: Die Klangfarbe ist das, woran du zwei Instrumente bei gleichem Ton und gleicher Lautstärke unterscheidest.
      - type: text
        text: |
          Eine Flöte und eine Geige klingen bei demselben Ton verschieden. Jedes Instrument bringt neben dem Grundton
          eigene Obertöne mit, und auch der Anfang des Tons klingt anders. Darum erkennst du Instrumente mit
          geschlossenen Augen.
      - type: definition
        term: Instrumentenfamilie
        explanation: Eine Instrumentenfamilie ist eine Gruppe von Instrumenten, die ihren Klang ähnlich erzeugen.
      - type: table
        caption: Die Instrumentenfamilien im Sinfonieorchester und die Tasteninstrumente
        header: [Familie, Beispiele, So entsteht der Klang]
        rows:
          - [
              Streicher,
              "Geige, Bratsche, Cello, Kontrabass",
              Eine Saite schwingt,
              zum Beispiel durch das Streichen mit dem Bogen.,
            ]
          - [Holzbläser, "Querflöte, Oboe, Klarinette, Fagott", Luft strömt durch das Instrument oder über einen Rand.]
          - [Blechbläser, "Trompete, Horn, Posaune, Tuba", Die Lippen schwingen im Mundstück.]
          - [Schlagwerk, "Pauke, Triangel, Becken, Glockenspiel", Du schlägst auf das Instrument.]
          - [Tasteninstrumente, "Klavier, Orgel", Du drückst Tasten.]
      - type: note
        title: Das Klavier
        blocks:
          - type: text
            text: Das Klavier hat Saiten und gehört trotzdem zu den Tasteninstrumenten. Du schlägst die Saiten nicht selbst an, das machen kleine Hämmer, wenn du eine Taste drückst.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: familien-zuordnen
        text: Welches Instrument gehört zu welcher Familie?
        pairs:
          - [Geige, Streicher]
          - [Oboe, Holzbläser]
          - [Trompete, Blechbläser]
          - [Pauke, Schlagwerk]
        explanation: Die Geige hat Saiten (Streicher). Die Oboe wird geblasen und gehört zu den Holzbläsern. Die Trompete hat ein Mundstück aus Metall (Blechbläser). Die Pauke schlägt man (Schlagwerk).
        links:
          - { title: Orchester (Wikipedia), url: "https://de.wikipedia.org/wiki/Orchester" }
      - type: generated
        id: familie-nennen
        given:
          i: { pick: 1, from: { data: instrumente }, distinct: true }
        task:
          text: "Zu welcher Familie gehört das Instrument {{i.name}}?"
        answer:
          value: "i.familie"
          compare: { choice: [Streicher, Holzbläser, Blechbläser, Schlagwerk, Tasteninstrumente] }
        hint: "Überlege, wie das Instrument seinen Klang erzeugt: mit Saiten, mit Luft, mit den Lippen, durch Schlagen oder mit Tasten."
        steps:
          - "Das Instrument {{i.name}} gehört zur Familie {{answer}}."
