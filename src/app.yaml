# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Musik erleben
intro: |
  Hör zu, klatsche, singe und probiere aus! In diesen Kapiteln erlebst du Töne, Rhythmen und Noten selbst. Du lernst,
  wie Musik aufgebaut ist, und baust zum Schluss eigene kleine Stücke. Die Klänge entstehen in deinem Browser.
  Das Mikrofon ist freiwillig: Jede Übung geht auch ohne. Nichts wird aufgenommen oder gespeichert.
  Für die Klassen 5 bis 7.
languages: [de]
chapters: [hoeren, tonhoehe]
sources:
  - title: Lehrplan Musik, Gymnasialer Bildungsgang (Hessisches Kultusministerium)
    url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2021-06/g9-musik.pdf
  - title: Klaviatur (Wikipedia)
    url: https://de.wikipedia.org/wiki/Klaviatur
