<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Ton steht auf welcher Linie des Notensystems im Violinschlüssel? Du zählst von unten.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Erste Linie</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
<li><label><span>Zweite Linie</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
<li><label><span>Dritte Linie</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
<li><label><span>Vierte Linie</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Erste Linie – e¹; Zweite Linie – g¹; Dritte Linie – h¹; Vierte Linie – d²</p>
<p class="question-explanation">Von unten nach oben tragen die Linien die Töne e, g, h, d, f. Die zweite Linie ist das g¹, um das sich der Violinschlüssel windet.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Violinschl%C3%BCssel" rel="noopener">Violinschlüssel (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In welche Richtung zählst du die Linien im Notensystem?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Von unten nach oben</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Von oben nach unten</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Von links nach rechts</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Von unten nach oben</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die unterste Linie ist die erste Linie. Von dort aus zählst du nach oben bis zur fünften Linie.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Von oben nach unten</strong></p><p>Das ist nicht üblich. Die Tonhöhe wächst nach oben, darum beginnst du unten.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Von links nach rechts</strong></p><p>Links nach rechts ist die Richtung, in der die Zeit vergeht und du die Noten liest, nicht die Richtung, in der du Linien zählst.</p></li>
</ul>
<p class="question-explanation">Linien und Zwischenräume werden von unten nach oben gezählt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Notenschrift" rel="noopener">Notenschrift (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
