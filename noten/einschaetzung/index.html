<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Eine Seite fragt sie nicht ab. Es lohnt sich also, sie einmal anzuschauen:</p>

</ul>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Ton steht auf welcher Linie des Notensystems im Violinschlüssel? Du zählst von unten.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Erste Linie</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
<li><label><span>Zweite Linie</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
<li><label><span>Dritte Linie</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
<li><label><span>Vierte Linie</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">g¹</option><option value="2">h¹</option><option value="0">e¹</option><option value="3">d²</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Erste Linie – e¹; Zweite Linie – g¹; Dritte Linie – h¹; Vierte Linie – d²</p>
<p class="question-explanation">Von unten nach oben tragen die Linien die Töne e, g, h, d, f. Die zweite Linie ist das g¹, um das sich der Violinschlüssel windet.</p>
<p class="question-more">Mehr dazu:</p>
