<p><strong>Richtige Antwort:</strong> Die Aussage stimmt.</p>
<p class="question-explanation">Von C bis G liegen sieben Halbtonschritte. Zählst du die Stufen, sind es fünf Töne, darum heißt das Intervall Quinte.</p>
